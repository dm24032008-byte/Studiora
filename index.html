<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest">
<title>Studiora V8</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#64748b;--brand:#2563eb;--brand2:#7c3aed;--line:#e5e7eb;--ok:#059669;--danger:#dc2626;--nav:#fff}
[data-theme=dark]{--bg:#0b1120;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--line:#263244;--nav:#0f172a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:#0f172a;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:21px;font-weight:850}.sub{font-size:11px;color:#cbd5e1}.head-actions{display:flex;gap:6px}.head-actions button{padding:8px 10px}
main{max-width:980px;margin:auto;padding:14px 14px 92px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}
h1{font-size:26px;margin:8px 0 14px}h2{font-size:19px;margin:0 0 10px}h3{font-size:15px;margin:0 0 5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.big{font-size:27px;font-weight:850}.muted,.stat{color:var(--muted);font-size:13px}
button,select,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;background:var(--brand);color:#fff;font-weight:750;cursor:pointer}
button.secondary{background:#eaf0ff;color:#1e40af}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.danger{background:#fee2e2;color:#991b1b}
[data-theme=dark] button.secondary{background:#172554;color:#bfdbfe}[data-theme=dark] button.danger{background:#3b1111;color:#fecaca}
select,input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}.timer{font-size:50px;text-align:center;font-weight:900;letter-spacing:1px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:700}.ok{color:var(--ok)}.due{color:#b45309;font-weight:700}
.topic{padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0}.subtopics{display:none;margin-top:8px;padding-left:8px}.topic.open .subtopics{display:block}
.check{display:flex;align-items:center;gap:9px;padding:7px 0}.check input{width:auto}.q{padding:12px;border:1px solid var(--line);border-radius:14px;margin:9px 0}
.hidden{display:none!important}nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 2px;z-index:30;overflow-x:auto}
nav button{background:transparent;color:var(--muted);padding:5px 4px;font-size:10px;min-width:55px}.active{color:var(--brand)!important}
.bar{display:flex;gap:8px;align-items:center}.bar>*{flex:1}.center{text-align:center}.empty{padding:20px;text-align:center;color:var(--muted)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}nav{position:static;max-width:980px;margin:auto;border:0;background:transparent}}
</style>
</head>
<body>
<header>
<div><div class="logo">📚 Studiora</div><div class="sub">Government Exam Study OS • V8</div></div>
<div class="head-actions"><button class="secondary" onclick="toggleTheme()">☾</button><button class="secondary" onclick="exportData()">Backup</button></div>
</header>
<main id="app"></main><nav id="nav"></nav>
<script>
const EXAMS={
"SSC CGL":{
"Quantitative Aptitude":["Number System","Percentage","Ratio & Proportion","Profit & Loss","Time & Work","Time, Speed & Distance","Algebra","Geometry","Mensuration","Data Interpretation"],
"Reasoning":["Series","Analogy","Classification","Coding-Decoding","Blood Relation","Direction Sense","Syllogism","Venn Diagram","Puzzle","Non-Verbal Reasoning"],
"English":["Grammar","Vocabulary","Error Detection","Sentence Improvement","Cloze Test","Reading Comprehension"],
"General Awareness":["History","Geography","Polity","Economy","Physics","Chemistry","Biology","Current Affairs"]
},
"Railway NTPC":{
"Mathematics":["Number System","Percentage","Ratio","Profit & Loss","Time & Work","Time & Distance","Algebra","Geometry","Statistics"],
"General Intelligence":["Analogy","Series","Coding-Decoding","Puzzle","Syllogism","Venn Diagram","Statement & Conclusion"],
"General Awareness":["History","Geography","Polity","Science","Economy","Current Affairs"]
},
"UPSC CSE":{
"History":["Ancient India","Medieval India","Modern India","World History","Art & Culture"],
"Geography":["Physical Geography","Indian Geography","World Geography","Environment"],
"Polity":["Constitution","Fundamental Rights","Parliament","Judiciary","Federalism","Governance"],
"Economy":["Basic Economics","Banking","Budget","Fiscal Policy","Monetary Policy"],
"Environment":["Ecology","Biodiversity","Climate Change","Conservation"],
"Science & Tech":["Biology","Space","IT","Biotechnology"]
},
"Banking":{
"Quant":["Number System","Percentage","Ratio","Profit & Loss","Time & Work","Data Interpretation"],
"Reasoning":["Puzzles","Seating Arrangement","Series","Syllogism","Inequality","Coding-Decoding"],
"English":["Grammar","Vocabulary","Cloze Test","Reading Comprehension"],
"General Awareness":["Banking Awareness","Economy","Current Affairs"]
},
"Rajasthan State Exams":{
"Rajasthan GK":["History","Geography","Polity","Culture","Economy","Current Affairs"],
"General Knowledge":["Indian History","Indian Polity","Geography","Science","Current Affairs"],
"Hindi":["Grammar","Vocabulary","Comprehension"],
"Reasoning":["Series","Coding-Decoding","Analogy","Puzzle"],
"Maths":["Number System","Percentage","Ratio","Profit & Loss","Time & Work"]
}};
const SUB={
"Percentage":["Basics","Percentage change","Successive percentage","Exam questions"],
"Ratio & Proportion":["Ratio basics","Proportion","Partnership","Mixture"],
"Profit & Loss":["Cost & selling price","Discount","Marked price","Practice sets"],
"Time & Work":["Work efficiency","Pipes & cisterns","Combined work","Practice sets"],
"Time, Speed & Distance":["Speed basics","Trains","Boats & streams","Relative speed"],
"Algebra":["Identities","Linear equations","Quadratic equations","Practice sets"],
"Geometry":["Lines & angles","Triangles","Circles","Polygons"],
"Series":["Number series","Alphabet series","Mixed series","Missing term"],
"Coding-Decoding":["Letter coding","Number coding","Mixed coding","Practice sets"],
"Grammar":["Parts of speech","Tenses","Subject-verb agreement","Articles"],
"Vocabulary":["Synonyms","Antonyms","One-word substitution","Idioms"],
"History":["Ancient","Medieval","Modern","Revision"],
"Geography":["Physical","Indian","World","Maps"],
"Polity":["Constitution","Fundamental rights","Parliament","Judiciary"],
"Science":["Physics","Chemistry","Biology","Everyday science"],
"Current Affairs":["National","International","Economy","Sports & awards"]
};
const MCQ=[
{q:"25% of 200 is?",o:["25","40","50","75"],a:2,t:"Percentage"},
{q:"If CP is ₹100 and SP is ₹120, profit is?",o:["10%","15%","20%","25%"],a:2,t:"Profit & Loss"},
{q:"Which is the largest planet?",o:["Earth","Mars","Jupiter","Venus"],a:2,t:"Science"},
{q:"The Constitution of India came into force on?",o:["15 Aug 1947","26 Jan 1950","26 Nov 1949","2 Oct 1950"],a:1,t:"Polity"},
{q:"Synonym of 'rapid'?",o:["Slow","Fast","Weak","Late"],a:1,t:"Vocabulary"}
];
const KEY="studiora_v8";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{exam:"SSC CGL",done:{},subdone:{},plan:[],notes:{},minutes:0,streak:0,lastStudy:"",revs:{},goals:{minutes:60,tasks:3},mock:{attempts:0,correct:0},theme:"light"};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function theme(){document.documentElement.dataset.theme=S.theme==="dark"?"dark":""}
theme();
function nav(active){let n=[["home","⌂","Home"],["syllabus","✓","Syllabus"],["plan","☷","Planner"],["timer","◷","Timer"],["revision","↻","Revision"],["notes","✎","Notes"],["mock","📝","Mock"],["stats","▥","Stats"]];document.getElementById("nav").innerHTML=n.map(x=>`<button class="${active==x[0]?"active":""}" onclick="page('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join("")}
function page(p){nav(p);let a=document.getElementById("app");({home,syllabus,plan,timer,revision,notes,mock,stats}[p])(a);scrollTo(0,0)}
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";save();theme()}
function examData(){return EXAMS[S.exam]}
function allTopics(){return Object.entries(examData()).flatMap(([sub,arr])=>arr.map(t=>({subject:sub,topic:t})))}
function selectExam(){return `<select onchange="S.exam=this.value;save();page('home')">${Object.keys(EXAMS).map(e=>`<option ${S.exam==e?"selected":""}>${e}</option>`).join("")}</select>`}
function markStudy(){let d=new Date().toISOString().slice(0,10);if(S.lastStudy!==d){S.streak++;S.lastStudy=d}}
function topicKey(subject,topic){return S.exam+"|"+subject+"|"+topic}
function counts(){let a=allTopics(),done=a.filter(x=>S.done[topicKey(x.subject,x.topic)]).length;return {total:a.length,done,p:Math.round(done/a.length*100)}}
function home(a){let c=counts(),td=S.plan.filter(x=>x.done).length; a.innerHTML=`<h1>Namaste 👋</h1>
<div class="card"><h2>Target Exam</h2>${selectExam()}<p class="stat">${c.done}/${c.total} topics complete</p><div class="progress"><i style="width:${c.p}%"></i></div></div>
<div class="grid"><div class="card"><div class="stat">Syllabus</div><div class="big">${c.p}%</div></div><div class="card"><div class="stat">Study minutes</div><div class="big">${S.minutes}</div></div><div class="card"><div class="stat">Streak</div><div class="big">${S.streak} 🔥</div></div><div class="card"><div class="stat">Tasks done</div><div class="big">${td}</div></div></div>
<div class="card"><h2>Today's goal</h2><p class="stat">${S.minutes}/${S.goals.minutes} study min • ${td}/${S.goals.tasks} tasks</p><div class="progress"><i style="width:${Math.min(100,Math.round(S.minutes/S.goals.minutes*100))}%"></i></div><div class="wrap" style="margin-top:10px"><button onclick="page('syllabus')">Study syllabus</button><button onclick="page('timer')">Start timer</button><button class="secondary" onclick="page('mock')">Mock test</button></div></div>
<div class="card"><h2>Quick actions</h2><div class="wrap"><button onclick="page('notes')">📝 Notes</button><button onclick="page('revision')">🔄 Revision</button><button onclick="page('plan')">📅 Planner</button><button onclick="page('stats')">📊 Analytics</button></div></div>`}
function syllabus(a){let html=`<h1>Syllabus</h1>${selectExam()}<div class="card"><p class="muted">Tap a subject to open topics. Tap a topic to reveal sub-topics.</p>`;
for(let [subject,topics] of Object.entries(examData())){let sd=topics.filter(t=>S.done[topicKey(subject,t)]).length;html+=`<div class="topic"><div class="row"><div><h3>${subject}</h3><span class="badge">${sd}/${topics.length} done</span></div><button class="secondary" onclick="this.closest('.topic').classList.toggle('open')">Open</button></div><div class="subtopics">`;
for(let t of topics){let k=topicKey(subject,t),d=!!S.done[k],subs=SUB[t]||["Concepts","Examples","Practice","Revision"];html+=`<div class="item"><div class="row"><div><b>${t}</b><div class="stat">${d?"Completed":"Not completed"}</div></div><button class="${d?"secondary":""}" onclick="toggleTopic('${subject}','${t}')">${d?"✓ Done":"Mark done"}</button></div><div class="subtopics" style="display:block;padding:6px 0 0 8px">`;
for(let st of subs){let sk=k+"|"+st,sdone=!!S.subdone[sk];html+=`<label class="check"><input type="checkbox" ${sdone?"checked":""} onchange="toggleSub('${subject}','${t}','${st}')"> ${st}</label>`}html+=`</div></div>`}html+=`</div></div>`}html+=`</div>`;a.innerHTML=html}
function toggleTopic(subject,t){let k=topicKey(subject,t);S.done[k]=!S.done[k];if(S.done[k]){markStudy();S.revs[k]=S.revs[k]||{round:0,next:new Date().toISOString().slice(0,10)}}save();page("syllabus")}
function toggleSub(subject,t,st){let sk=topicKey(subject,t)+"|"+st;S.subdone[sk]=!S.subdone[sk];save()}
function plan(a){a.innerHTML=`<h1>Daily Planner</h1><div class="card"><div class="bar"><input id="task" placeholder="Task e.g. Percentage PYQ"><input id="mins" type="number" min="1" placeholder="Min"></div><button style="margin-top:8px" onclick="addTask()">Add task</button></div><div class="card"><h2>Today's tasks</h2>${S.plan.length?S.plan.map((x,i)=>`<div class="item row"><div><b>${x.t}</b><div class="stat">${x.m} min</div></div><div class="wrap"><button class="${x.done?"secondary":""}" onclick="S.plan[${i}].done=!S.plan[${i}].done;save();page('plan')">${x.done?"✓":"Done"}</button><button class="danger" onclick="S.plan.splice(${i},1);save();page('plan')">×</button></div></div>`).join(""):"<div class='empty'>No tasks yet.</div>"}</div><div class="card"><h2>Daily goal</h2><div class="bar"><input id="gmin" type="number" value="${S.goals.minutes}"><input id="gtask" type="number" value="${S.goals.tasks}"></div><button class="secondary" style="margin-top:8px" onclick="S.goals.minutes=+gmin.value||60;S.goals.tasks=+gtask.value||3;save();page('plan')">Save goals</button></div>`}
function addTask(){let t=task.value.trim(),m=+mins.value||30;if(t){S.plan.push({t,m,done:false});save();page("plan")}}
let interval=null,seconds=0;
function timer(a){a.innerHTML=`<h1>Study Timer</h1><div class="card center"><div id="clock" class="timer">${fmt(seconds)}</div><div class="wrap" style="justify-content:center"><button onclick="start()">Start</button><button class="secondary" onclick="pause()">Pause</button><button class="secondary" onclick="finish()">Finish</button><button class="ghost" onclick="resetTimer()">Reset</button></div><p class="muted">Completed minutes are added to your total and streak.</p></div><div class="card"><h2>Focus tip</h2><p class="muted">Use 25–50 minute focused sessions, then take a short break.</p></div>`}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function start(){if(interval)return;interval=setInterval(()=>{seconds++;let c=document.getElementById("clock");if(c)c.textContent=fmt(seconds)},1000)}
function pause(){clearInterval(interval);interval=null}
function resetTimer(){pause();seconds=0;page("timer")}
function finish(){pause();let m=Math.floor(seconds/60);if(m>0){S.minutes+=m;markStudy()}seconds=0;save();page("timer")}
function revision(a){let items=Object.entries(S.revs),today=new Date().toISOString().slice(0,10);a.innerHTML=`<h1>Smart Revision</h1><div class="card"><p class="muted">Spaced cycle: 1 → 3 → 7 → 15 → 30 days.</p>${items.length?items.map(([k,v])=>{let due=(v.next||today)<=today;let parts=k.split("|");return `<div class="item"><div class="row"><div><b>${parts[2]}</b><div class="stat">${parts[1]} • Round ${v.round||0} • Next ${v.next||today}</div></div>${due?'<span class="due">DUE</span>':''}</div><button style="margin-top:7px" onclick="revise('${k}')">Revise now</button></div>`}).join(""):"<div class='empty'>Complete syllabus topics to create revision cards.</div>"}</div>`}
function revise(k){let v=S.revs[k]||{round:0},days=[1,3,7,15,30][Math.min(v.round,4)];v.round=Math.min((v.round||0)+1,5);let d=new Date();d.setDate(d.getDate()+days);v.next=d.toISOString().slice(0,10);S.revs[k]=v;markStudy();save();page("revision")}
function notes(a){let ts=allTopics();a.innerHTML=`<h1>Notes</h1><div class="card"><select id="noteTopic" onchange="loadNote()">${ts.map(x=>`<option value="${x.subject}|${x.topic}">${x.subject} → ${x.topic}</option>`).join("")}</select><textarea id="note" rows="12" placeholder="Write your notes, formulas, facts or shortcuts..."></textarea><button style="margin-top:8px" onclick="saveNote()">Save note</button></div><div class="card"><h2>Tip</h2><p class="muted">Keep notes short and exam-focused. Use one note per topic.</p></div>`;loadNote()}
function loadNote(){let t=document.getElementById("noteTopic"),n=document.getElementById("note");if(t&&n)n.value=S.notes[S.exam+"|"+t.value]||""}
function saveNote(){let t=document.getElementById("noteTopic").value;S.notes[S.exam+"|"+t]=document.getElementById("note").value;save();alert("Note saved")}
function mock(a){a.innerHTML=`<h1>Mock Test</h1><div class="card"><p class="stat">5 quick questions • Score is saved in Analytics</p>${MCQ.map((x,i)=>`<div class="q"><b>Q${i+1}. ${x.q}</b>${x.o.map((o,j)=>`<label class="check"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join("")}</div>`).join("")}<button onclick="submitMock()">Submit test</button></div>`}
function submitMock(){let score=0;MCQ.forEach((x,i)=>{let el=document.querySelector(`input[name=q${i}]:checked`);if(el&&+el.value===x.a)score++});S.mock.attempts++;S.mock.correct+=score;markStudy();save();alert("Score: "+score+"/"+MCQ.length);page("stats")}
function stats(a){let c=counts(),tasks=S.plan.filter(x=>x.done).length,avg=S.mock.attempts?Math.round(S.mock.correct/S.mock.attempts):0;a.innerHTML=`<h1>Analytics</h1><div class="grid"><div class="card"><div class="stat">Syllabus</div><div class="big">${c.p}%</div></div><div class="card"><div class="stat">Study minutes</div><div class="big">${S.minutes}</div></div><div class="card"><div class="stat">Streak</div><div class="big">${S.streak}</div></div><div class="card"><div class="stat">Notes</div><div class="big">${Object.keys(S.notes).length}</div></div></div><div class="card"><h2>Mock performance</h2><p class="stat">${S.mock.attempts} attempts • ${S.mock.correct} total correct • Avg ${avg}/5</p></div><div class="card"><h2>Backup & restore</h2><div class="wrap"><button onclick="exportData()">Export JSON</button><button class="secondary" onclick="document.getElementById('file').click()">Import JSON</button></div><input id="file" class="hidden" type="file" accept=".json" onchange="importData(event)"></div>`}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),x=document.createElement("a");x.href=u;x.download="studiora-v8-backup.json";x.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();theme();page("home");alert("Backup restored")}catch(_){alert("Invalid backup file")}};r.readAsText(f)}
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
page("home");
</script>
</body></html>
